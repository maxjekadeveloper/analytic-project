services:
  kafka:
    image: apache/kafka:latest
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    container_name: analytics-kafka
    ports:
      - "29094:29094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:29094,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:29094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:17
    container_name: analytics-postgres
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: analytics-server
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKER: kafka:29092  
    depends_on:
      - kafka

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile

    container_name: analytics-service

    environment:
      KAFKA_BROKER: kafka:29092
      DATABASE_URL: postgres://analytics:analytics@postgres:5432/analytics?sslmode=disable

    depends_on:
      - kafka
      - postgres        