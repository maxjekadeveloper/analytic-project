services:
  kafka:
    image: apache/kafka:latest
    container_name: analytics-kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:17
    container_name: analytics-postgres
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: analytics-server
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKER: kafka:9092  
    depends_on:
      - kafka

  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile

    container_name: analytics-service

    environment:
      KAFKA_BROKER: kafka:9092
      DATABASE_URL: postgres://analytics:analytics@postgres:5432/analytics?sslmode=disable

    depends_on:
      - kafka
      - postgres        